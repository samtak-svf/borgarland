# Watches the one dependency this project does not own.
#
# Reykjavík publishes no API. The app files reports through the city's own web
# form endpoint, which is undocumented and can change field names, add a
# captcha, or start checking Origin at any time with no notice to us. If that
# happens we want to find out from a red build, not from a user standing next to
# an overflowing bin.
#
# The probe posts a payload the city must reject, so it creates nothing. Do NOT
# extend this into a real submission — an end-to-end test that files a genuine
# report puts work in a real queue, and doing it on a schedule would be abuse.
#
# It asserts on the STRUCTURE of the rejection, not on page text. An earlier
# version looked for "Hvar er þetta?", which is the static help text under the
# location field and is present in every render of the page — it would have
# passed no matter what the validator did.
name: contract

on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/send-report.mjs'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reykjavik-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: The submission endpoint still rejects an incomplete payload the way we expect
        run: |
          set -uo pipefail
          URL=https://reykjavik.is/abendingar/senda-abendingu/ruslafotur
          body=$(mktemp)
          code=$(curl -sS -X POST -F "dummy=1" -o "$body" -w '%{http_code}' "$URL")

          fail=0
          [ "$code" = "400" ] || { echo "::error::expected HTTP 400 from $URL, got $code"; fail=1; }

          # The validator's own vocabulary, not page copy. If this disappears,
          # something other than the route answered — a WAF, a captcha gate, a
          # redirect — and the adapter needs revisiting.
          grep -qF 'Missing required fields' "$body" \
            || { echo "::error::the 400 no longer carries the validator's error envelope"; fail=1; }
          grep -qF '\"description\"' "$body" \
            || { echo "::error::description is no longer named as an input error"; fail=1; }

          # Documented in docs/research/payload-map.md: the city enforces only
          # description, which is why our relay has to enforce the coordinate.
          # If that ever changes, the doc and the relay's validation are both
          # stale and should be revisited — so fail loudly rather than quietly
          # becoming more correct.
          if grep -qE '\\"(lat|lng)\\"' "$body"; then
            echo "::error::the city now validates lat/lng too — payload-map.md says it does not"
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "The city's form no longer behaves as documented."; exit 1; }
          echo "✓ endpoint reachable anonymously, validating server-side, description-only"

      - name: The address lookups still answer in the documented shape
        run: |
          set -uo pipefail
          fail=0
          curl -sS 'https://reykjavik.is/location/addresses?q=Laugavegur+1' \
            | grep -q 'fasteignarheiti_nefnifall' \
            || { echo "::error::/location/addresses no longer returns the expected shape"; fail=1; }

          # Note the path: addressInfo is under /abendingar/, its sibling is not.
          curl -sS -G --data-urlencode 'a=Laugavegur 1' --data-urlencode 'p=101' \
            'https://reykjavik.is/abendingar/addressInfo' \
            | grep -q '"geometry"' \
            || { echo "::error::/abendingar/addressInfo no longer returns geometry"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ address search and address-to-coordinate both answering"

      - name: The fill-in script builds a payload without sending one
        run: |
          set -euo pipefail
          out=$(node scripts/send-report.mjs --category ruslafotur \
                  --description "contract check, nothing is sent" \
                  --address "Laugavegur 1" --postcode 101)
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'Nothing sent' || {
            echo "::error::send-report.mjs no longer defaults to not sending — that default is the safety"
            exit 1
          }
          printf '%s' "$out" | grep -q 'Ábending -> Ruslafötur'
          echo "✓ payload built, nothing sent"
