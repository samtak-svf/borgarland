# The SwiftUI shell builds. Separate from relay-request-contract.yml on
# purpose: that workflow's ios-core job proves the CONTRACT holds and needs
# nothing but `swift test` on a macOS host — no simulator, no Xcode project.
# This one needs both, so it is slower and fails for different reasons. It does
# NOT need signing: the build below is explicitly unsigned, and signing belongs
# to ios-release.yml, which is the only workflow that touches a certificate. Keeping them apart means a broken shell never hides a
# broken contract, and a contract failure is never diagnosed as a UI problem.
#
# macos-latest minutes are free because this repository is public.
name: ios-ci

# The filter names the four data files this app bundles rather than `data/**`
# (#194): a change to data/field-tests.json is a walk transcript no app reads,
# and under `data/**` it rebuilt this app and ran a simulator suite that could
# say nothing about it. scripts/check-app-path-filters.mjs holds the list to
# ios/project.yml, because a stale filter fails silently — the workflow simply
# stops running on the change it exists to catch.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'data/reykjavik-form.json'
      - 'data/relay-request.json'
      - 'data/category-labels.json'
      - 'data/relay-outcomes.json'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

# One run per workflow per branch: a superseded run's answer is about code the
# branch no longer has, and while it finishes it holds the runner that the run
# which matters is waiting for (#193). Measured on feat/report-remembers-its-walk
# on 2026-08-31: seven pushes bought seven full runs and zero were cancelled.
#
# `github.workflow` is part of the group because every workflow here triggers on
# the same push; keyed by ref alone, android-ci would cancel ios-ci. Cancelling
# is confined to `pull_request`, so a push to `main` and a manual dispatch, both
# deliberate, are never cut short by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v5

      - name: Record the toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # The two data files are referenced in place from data/ at the
      # repository root rather than copied, so the only way they can be missing
      # from the bundle is a project.yml mistake. That is exactly the mistake
      # `resources:` (not a XcodeGen key, silently ignored) produces, so the
      # build is not trusted until the bundle is unpacked and checked below.
      # `set -o pipefail` is not decoration. Piping xcodebuild into a
      # formatter hands the step the FORMATTER's exit code, so a failed build
      # reports success and the job goes green on a binary that does not exist.
      # The sibling workflow this is modelled on (rosaparks ios-ci.yml) has
      # exactly that hole; it is not copied here.
      #
      # The destination is generic rather than a named simulator: runner images
      # rename and retire devices, and a build that needs 'iPhone 16' to exist
      # fails months later for a reason that has nothing to do with the code.
      - name: Build for the simulator, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project Borgarland.xcodeproj \
            -scheme Borgarland \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: The contract files really are in the bundle
        run: |
          app="$(find build/Build/Products -name 'Borgarland.app' -maxdepth 3 | head -1)"
          test -n "$app" || { echo "no Borgarland.app was produced"; exit 1; }
          for f in reykjavik-form.json relay-request.json category-labels.json relay-outcomes.json; do
            test -f "$app/$f" || { echo "::error::$f is missing from the bundle"; exit 1; }
            echo "$f is present"
          done
          # Referenced in place, so byte-identical is the only acceptable result.
          for f in reykjavik-form.json relay-request.json category-labels.json relay-outcomes.json; do
            cmp "$app/$f" "../data/$f" || { echo "::error::$f differs from data/$f"; exit 1; }
          done

      - name: Keep the built app
        uses: actions/upload-artifact@v7
        with:
          name: Borgarland-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Borgarland.app
          retention-days: 14

  # The only check in this repository that can see a layout.
  #
  # Every iOS defect this project has found came from a person holding a phone:
  # #73, #74, #76, #77, #78 and #79 from one field test, #85 and #86 from
  # another. The loop is a signed build, an upload, App Store processing and
  # somebody's evening. #110 was the clearest case, a keyboard covering a
  # submit button, and it compiled perfectly, passed every unit test, and sat
  # in screenshots nobody had read yet.
  #
  # A simulator catches that shape for the price of a job on a runner this
  # public repository already gets free. It does NOT replace a phone in a hand;
  # data/field-tests.json exists because the two find different things (#125).
  #
  # A separate job rather than another step in `build`, so a UI failure and a
  # compile failure are never diagnosed as each other.
  uitest:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # The destination is RESOLVED, not named. Runner images rename and retire
      # devices, and a workflow that needs 'iPhone 16' to exist fails months
      # later for a reason with nothing to do with the code, which is the same
      # lesson the generic destination in the build job above is written for. A
      # UI test cannot use a generic destination, so it asks the runner what it
      # actually has instead of assuming.
      - name: Pick a simulator the runner actually has
        id: sim
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -i iphone || true
          udid=$(xcrun simctl list devices available \
            | awk -F'[()]' '/^[[:space:]]*iPhone/ { print $2; exit }')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            exit 1
          fi
          echo "Chose $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # A hardware keyboard attached to the simulator suppresses the software
      # one, and the software keyboard is the entire subject of these tests.
      # Without this the assertion that it came up fails, which is the right
      # direction to fail in and still a wasted run.
      - name: Make the software keyboard the one that appears
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true

      # `set -o pipefail` for the same reason as the build job: piping into a
      # formatter otherwise hands the step the FORMATTER's exit code, and a
      # failed test run reports success.
      #
      # The per-test times come from xcpretty's own JUnit report rather than from
      # a `tee` of the raw output, and that is not a preference. A `tee` in this
      # pipeline fails the step while the suite is green: measured twice, runs
      # 35001476829 and 35001496802, each ending "▸ Test Succeeded" followed by
      # "##[error]Process completed with exit code 1". xcpretty stops reading once
      # it has printed the summary, the middle stage takes SIGPIPE, and pipefail
      # — which is doing its job — hands the step that status. The JUnit report
      # is the same numbers in a form a summary can read.
      - name: Run the UI tests on the simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Borgarland.xcodeproj \
            -scheme Borgarland \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/uitest.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output build/uitest-junit.xml

      # The number beside the first test is not that test's (#196). Publishing
      # the table is the cheap half of that issue: a session looking for the
      # slow part of this job finds the first test, spends an afternoon on it
      # and changes nothing, because what it is paying is the app's install, its
      # first launch and XCUITest's own warm-up.
      #
      # Measured on 2026-09-15. Baseline, run 34997276456: the first test 43.794 s
      # against 18.356 s for the test of the same name in the other class, and
      # 133 s of tests inside a 537 s step — so ~404 s of that step is compile,
      # boot, install and launch.
      #
      # PRE-WARMING THE SIMULATOR WAS TRIED AND REJECTED. Both variants measured:
      #   - a headless `xcrun simctl boot`, run 34999085246: the device boots with
      #     no Simulator process, ConnectHardwareKeyboard above is never applied,
      #     the software keyboard never appears — the thing these tests are ABOUT
      #     — and the run failed in 5m53s with "Failed to synthesize event:
      #     Neither element nor any descendant has keyboard focus". Not one test
      #     reported a time.
      #   - `open -a Simulator` then wait, run 35000052756: green, and every
      #     number below got honest (first test 43.794 -> 25.749 s, its twin
      #     18.356 -> 13.997 s, tests 133 -> 82 s). It also cost the job 66 s —
      #     581 -> 647 s — because xcodebuild pays its own setup anyway, so the
      #     boot is paid twice and only the per-test numbers improve.
      #
      # 66 seconds of the slowest gate on every PR is too much to pay for a
      # better label, so the boot is left where it is and the table below is
      # what makes the cost legible. What remains on the first test is the app's
      # first launch and XCUITest's warm-up, which no step can move; the compile
      # is #195's.
      #
      # `if: always()`, because a failed suite is when somebody is most likely
      # to be staring at these numbers and least likely to have them.
      - name: Say which test paid the suite's fixed cost
        if: always()
        run: |
          report=build/uitest-junit.xml
          {
            echo '## UI test times'
            echo ''
            echo 'The first test to run pays this suite'\''s fixed cost — the app install,'
            echo 'its first launch, and XCUITest'\''s own warm-up — so the first line below'
            echo 'is start-up rather than the test (#196).'
            echo ''
            echo '```'
            grep -o '<testcase [^>]*>' "$report" 2>/dev/null | while read -r tag; do
              # Each attribute is read on its own, and anchored on the space
              # before it, rather than assuming the order xcpretty writes them
              # in. `name="` is a substring of `classname="`, so an unanchored
              # match reads the class into the test's name the moment the
              # attribute order changes — which is what the first version of
              # this did.
              class=$(printf '%s' "$tag" | sed -E 's/.*[[:space:]]classname="([^"]*)".*/\1/')
              name=$(printf '%s' "$tag" | sed -E 's/.*[[:space:]]name="([^"]*)".*/\1/')
              time=$(printf '%s' "$tag" | sed -E 's/.*[[:space:]]time="([0-9.]*)".*/\1/')
              printf '%s.%s %s s\n' "${class##*.}" "$name" "$time"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Said out loud as well, because a summary that came out empty and a
          # summary that was never written look identical from here otherwise.
          rows=$(grep -c -o '<testcase ' "$report" 2>/dev/null || true)
          echo "per-test rows published to the job summary: ${rows:-0}"
          if [ "${rows:-0}" = "0" ]; then
            echo "::warning::$report has no test cases in it, so the summary above says nothing about this run"
          fi

      # Failure screenshots are in here, which is the whole point on a machine
      # nobody can look at.
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Borgarland-uitest-results
          path: ios/build/uitest.xcresult
          retention-days: 14
