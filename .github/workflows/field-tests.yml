# Fails when a field-test record disagrees with the contracts it transcribes.
#
# data/field-tests.json is written by hand, after the fact, from D1 and
# Workers Logs. That is the only way to record what a build did in a hand on a
# real device, and it is also the way transcription errors get in: an event
# name given a plausible spelling it never had, a field the allowlist does not
# permit, an issue number transposed.
#
# scripts/check-field-tests.mjs checks each timeline against
# data/relay-events.json, which is the allowlist the Worker itself enforces.
# An event that could not have crossed the wire cannot have been observed. It
# also refuses a string where the contract has no free-text field, which is
# where a description or a place name would land if one were ever pasted into
# a record by mistake.
name: field-tests

on:
  pull_request:
    paths:
      - 'data/field-tests.json'
      - 'data/relay-events.json'
      - 'data/reykjavik-form.json'
      - 'scripts/check-field-tests.mjs'
      - '.github/workflows/field-tests.yml'
  workflow_dispatch:

# One run per workflow per branch: a superseded run's answer is about code the
# branch no longer has, and while it finishes it holds the runner that the run
# which matters is waiting for (#193). Measured on feat/report-remembers-its-walk
# on 2026-08-31: seven pushes bought seven full runs and zero were cancelled.
#
# `github.workflow` is part of the group because every workflow here triggers on
# the same push; keyed by ref alone, android-ci would cancel ios-ci. Cancelling
# is confined to `pull_request`, so a push to `main` and a manual dispatch, both
# deliberate, are never cut short by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Every recorded event is one the contract allows
        run: node scripts/check-field-tests.mjs
