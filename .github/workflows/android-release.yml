# The signed Android build: a release APK and an AAB, signed with the upload
# key, verified against a pinned fingerprint, attached to a GitHub release.
#
# The counterpart of ios-release.yml, and it follows that file's shape rather
# than the house Android pattern in ~/.claude/skills/sosi-android-app-delivery
# on one point: signing material comes from GitHub secrets, not from Workload
# Identity Federation into GCP. The skill's rule exists for apps on the party
# Play account with a WIF pool already standing. This app has neither, and this
# repository ALREADY signs iOS from GitHub secrets, so a second auth mechanism
# would be a fork for its own sake. The keystore is backed up in Secret Manager
# (borgarland-android-upload-*, project fedora-setup-secrets).
#
# Until the three secrets exist this workflow SKIPS with a visible reason
# instead of failing, for the same reason ios-release.yml does: pushing a tag
# before signing is configured should not produce a red build that means
# nothing.
name: android-release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName for this build, e.g. 0.1.0'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

env:
  # The upload certificate this workflow will accept and no other. If a wrong
  # secret is mounted, or signing silently falls through to unsigned, the build
  # fails loudly instead of publishing an artifact nobody can update later.
  # Play pins this certificate to is.borgarland permanently.
  EXPECTED_SIGNER_SHA256: 35f297e41be8bb04e3362130c926d57a860cdcf9d0a1108b0e9c33de1f03184c

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets_present: ${{ steps.check.outputs.secrets_present }}
    steps:
      - id: check
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [[ -n "$KS" && -n "$KS_PWD" && -n "$KS_ALIAS" ]]; then
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
            echo "All three signing secrets are set, building signed."
          else
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not configured, skipping the release build."
          fi

  build-and-release:
    needs: check-secrets
    if: needs.check-secrets.outputs.secrets_present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # The keystore never touches the repository. It is written outside the
      # working tree so no build step, no artifact upload and no stray `git add`
      # can pick it up.
      - name: Decode the upload keystore
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/borgarland-upload.p12"
          test -s "$RUNNER_TEMP/borgarland-upload.p12"

      # versionCode comes from the run number so it always increases, which is
      # what Play requires and what a human forgets. versionName comes from the
      # tag or the dispatch input, never from the Gradle default -- the delivery
      # skill's rule is that the hardcoded default must never reach a store.
      - name: Work out the version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            NAME="${GITHUB_REF_NAME#android-v}"
          else
            NAME="${{ inputs.version_name }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=${{ github.run_number }}"

      - name: Build the signed APK and AAB
        env:
          BORGARLAND_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/borgarland-upload.p12
          BORGARLAND_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          BORGARLAND_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BORGARLAND_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          BORGARLAND_VERSION_NAME: ${{ steps.version.outputs.name }}
          BORGARLAND_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease bundleRelease

      # The step that makes a wrong key impossible to ship rather than unlikely.
      - name: Verify the signature against the pinned fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::no signed APK was produced -- signing fell through"; exit 1; }
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 -i 'certificate SHA-256 digest' \
            | awk '{print $NF}')
          echo "expected: $EXPECTED_SIGNER_SHA256"
          echo "actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "::error::signed with the wrong key. Play pins the upload certificate, so publishing this would be unrecoverable."
            exit 1
          fi
          echo "Signature matches the pinned upload certificate."

      - name: Keep the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: borgarland-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish a GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Borgarland Android ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes "Signed with the upload key, fingerprint verified against \`$EXPECTED_SIGNER_SHA256\`.

          The APK is sideloadable. The AAB is what Play takes." \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab
