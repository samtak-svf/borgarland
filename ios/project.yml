name: Borgarland

# The app target. The logic it is a shell around lives in BorgarlandCore, a
# plain SwiftPM package that builds and tests on a macOS host with no
# simulator, no signing and no Xcode project — see
# .github/workflows/relay-request-contract.yml. This file exists only for the
# parts that genuinely need Xcode: a bundle, an Info.plist, entitlements,
# signing.
#
# Generated, never committed: `xcodegen generate` in ios/ produces
# Borgarland.xcodeproj, which .gitignore excludes. A committed project file is
# a second source of truth that drifts from this one.

options:
  bundleIdPrefix: is.borgarland
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # MARKETING_VERSION mirrors versionName in android/app/build.gradle.kts and
    # is the number a person reads. CURRENT_PROJECT_VERSION does NOT mirror
    # versionCode: it is the upload counter for this platform's store, and
    # TestFlight refuses a second upload that reuses one. It advances whenever a
    # build is uploaded, which iOS has now done twice and Android not at all, so
    # the two deliberately no longer agree.
    #
    # 2: the first build reached TestFlight pointing at http://127.0.0.1:8787,
    # which on a phone is the phone (#29). That one was built against the
    # deployed relay, but could not be PROVEN to be: both hosts were
    # unconditional constants, so `strings` on the .ipa found both.
    # 3: the loopback is behind `#if DEBUG` (#51), so a release binary carries
    # one host and the artifact check finally discriminates.
    # 4: the first build that reports anything back. Client telemetry to our own
    # relay and Crashlytics for the crash it cannot report itself (#53).
    # 5: the first build that answers a field test. Two testers walked build 4
    # and it lost their reports, so this one writes a report down before it
    # sends it (#73), gives it an id that makes a second press harmless (#85),
    # tells a person what happened in a sentence rather than the relay's JSON
    # (#77), and lets them out of a denied permission (#76). It is also the
    # first iOS build that reads data/category-labels.json (#40), which build 4
    # predates, so it is the first iOS build that says "Annað í almannarými"
    # rather than the city's suggestion box.
    # 6: the first build whose telemetry can be trusted about permissions, and
    # the first that does not call itself a POC to the person it is asking for
    # a location (#135). Build 5 told a tester she had refused a dialog she was
    # still reading, after sixty seconds (#134); that bound is gone, and the
    # event recording that somebody was asked now fires only when a dialog is
    # actually put up (#139). Build 5 emitted neither, so the asked-to-answered
    # gap is measurable from this build and from no earlier one.
    # 7: the first build that tells somebody a refusal is final, and the first
    # whose telemetry survives being closed. A report outside Reykjavik cannot
    # be made to succeed by pressing send again, and build 6 offered the button
    # anyway; this one disables it and says which postal locality the nearest
    # registered address is in (#148). And a session where somebody opens the
    # app, looks and leaves used to leave no trace at all: the buffer is memory
    # only, the flush at background posted from a process iOS was already
    # suspending, and nothing asked it to wait. This build holds a
    # background-task assertion across that flush (#126), so every iOS count
    # taken before it is a lower bound rather than a measurement.
    #
    # Two things in it are not the binary. `method` in ExportOptions.plist is
    # `app-store-connect`, the spelling Xcode has been asking for since build
    # 5's export log (#103), which travels here because a real ios-v* tag is
    # the only place that step runs. And the app now answers a
    # -uiTestDetailsScreen launch argument under `#if DEBUG` so a simulator can
    # reach the details screen (#125); Release does not compile it, so it is
    # absent from this build and from every build anybody can install.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 7
  configs:
    # Explicit rather than left to XcodeGen's preset, because RelayClient
    # selects the relay host on `#if DEBUG` (#29). Getting this wrong is
    # safe in the dangerous direction — an undefined DEBUG makes a debug build
    # talk to the deployed relay, never the reverse — but a build setting that
    # decides where a report goes should be written down, not inherited.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  BorgarlandCore:
    path: BorgarlandCore
  # Crashlytics only. Analytics is off in GoogleService-Info.plist and no
  # Analytics product is pulled in: a citizen-reporting app has no business
  # collecting behavioural analytics, and the privacy policy (#5) is still open.
  # The instrumentation we DO want is our own, goes to our own relay, and
  # carries no content (data/relay-events.json).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  Borgarland:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Note `buildPhase: resources` on every entry below. `resources:` is NOT
      # a XcodeGen target key: it parses, it is silently ignored, and it once
      # shipped an .ipa with no assets in it.
      #
      # This entry was removed while the directory was empty, because XcodeGen
      # validates every source path and git does not track empty directories.
      # It is back now that it holds the thing the App Store refuses a build
      # without.
      - path: Resources
        buildPhase: resources
      # The facts file and the relay request contract have exactly one home
      # each: data/ at the repository root (decision 0001). Android copies them
      # into assets at build time because Gradle has no way to reference a file
      # outside the module; Xcode does, so they are referenced in place and
      # cannot drift at all. Note `buildPhase: resources` on every entry —
      # `resources:` is NOT a XcodeGen target key, it is silently ignored, and
      # that mistake once shipped an .ipa with no assets in it.
      - path: ../data/reykjavik-form.json
        buildPhase: resources
      - path: ../data/relay-request.json
        buildPhase: resources
      - path: ../data/category-labels.json
        buildPhase: resources
      - path: ../data/relay-outcomes.json
        buildPhase: resources
    dependencies:
      - package: BorgarlandCore
        product: BorgarlandCore
      - package: Firebase
        product: FirebaseCrashlytics
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Borgarland
        # Both are required, and the build settings alone are not enough.
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION populate an Info.plist
        # only where the plist references them; the one XcodeGen generates from
        # this block does not, so without these two lines Xcode's defaults win
        # silently and the app reports 1.0 (1). Found by unpacking the first
        # signed .ipa, which is the only place it was visible.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required since the iOS 11 SDK, and TestFlight rejects the upload
        # without it: error 90713, which arrives after a full successful build
        # and export. ASSETCATALOG_COMPILER_APPICON_NAME below names the same
        # set in the catalogue; both are needed.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # The three permission strings, in Icelandic because they are user-facing.
        NSCameraUsageDescription: >-
          Borgarland opnast á myndavélinni. Ábending er mynd af því sem er að,
          á þeim stað þar sem það er.
        NSLocationWhenInUseUsageDescription: >-
          Hnitin fylgja myndinni. Án staðsetningar getur enginn brugðist við
          ábendingunni, svo appið sendir hana ekki.
        NSPhotoLibraryUsageDescription: >-
          Mynd úr safninu má nota í stað þess að taka nýja. Staðsetningin er þá
          lesin úr myndinni sjálfri.
        # The counterpart of android/app/src/main/res/xml/network_security_config.xml:
        # cleartext to the loopback relay during development, and nowhere else.
        # The city is never on this path (decision 0002).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.borgarland
        TARGETED_DEVICE_FAMILY: "1"
        # Names the icon set inside Resources/Assets.xcassets. The Info.plist's
        # CFBundleIconName above names the same set; the build needs this one
        # to compile the catalogue and the upload needs that one to accept it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        # Simulator builds in CI are unsigned. Signing settings belong on the
        # Release config alone: passing them as xcodebuild command-line
        # overrides applies them to every SPM package target too, and package
        # targets reject provisioning profiles.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          # The party's Apple team, which already carries a proven Mac-free
          # signing chain (issue #37). A bundle identifier moves between teams
          # later; this is the team that can install on a phone today.
          DEVELOPMENT_TEAM: B4724Z74TM
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Borgarland App Store"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"

  # The one check that can see a layout, and the only one that could have
  # caught #110 without a person holding a phone (#125). It runs on a
  # simulator, which macos-latest already has and which this repository pays
  # nothing for.
  #
  # `bundle.ui-testing` drives the app from a separate process, so it needs the
  # app target as a dependency and nothing else. Unsigned like the app's own
  # simulator build; signing belongs to ios-release.yml alone.
  BorgarlandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Borgarland
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: is.borgarland.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

# Declared rather than left to Xcode's autocreation, because `xcodebuild test`
# needs the UI test bundle to be IN the scheme's test action and an autocreated
# scheme is not shared, so CI cannot see it. `ios-release.yml` archives this
# same scheme; its build and archive actions are unchanged by the test action
# gaining a target.
schemes:
  Borgarland:
    build:
      targets:
        Borgarland: all
        BorgarlandUITests: [test]
    test:
      config: Debug
      targets:
        - BorgarlandUITests
    run:
      config: Debug
    archive:
      config: Release
